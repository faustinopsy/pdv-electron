<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PDV - Cadastro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-container">
    <h1>Cadastrar Usuário</h1>
    <div class="form-group">
      <label for="reg-username">Usuário:</label>
      <input type="text" id="reg-username" required>
    </div>
    <div class="form-group">
      <label for="reg-password">Senha:</label>
      <input type="password" id="reg-password" required>
    </div>
    <div class="form-group">
      <label for="reg-role">Perfil:</label>
      <select id="reg-role">
        <option value="admin">Admin</option>
        <option value="funcionario">Funcionário</option>
      </select>
    </div>
    <div class="btn-group">
        <button id="register-btn">Cadastrar</button>
        <button id="login-btn">Login</button>
    </div>
    
    <p id="register-error-message" class="error"></p>
    <p id="register-success-message" class="success"></p>
  </div>
  <script src="../js/views/RegisterView.js"></script>
</body>
</html>
